<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juste une perf ? Pertinence des cathéters et relais per os</title>
  <meta name="description" content="Serious game de formation : réévaluer chaque jour la pertinence des cathéters veineux et repérer les possibilités de relais per os.">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" type="button" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 3c4 6 8 10.5 8 15a8 8 0 0 1-16 0c0-4.5 4-9 8-15z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 22h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Juste une perf&nbsp;?</span>
    </button>
    <div class="hud" id="hud" hidden>
      <span class="hud-item"><span class="hud-label">Dossier</span> <strong id="hudCase">1/14</strong></span>
      <span class="hud-item"><span class="hud-label">Score</span> <strong id="hudScore">0</strong></span>
      <span class="hud-item"><span class="hud-label">Jours-cathéter évités</span> <strong id="hudDays">0</strong></span>
    </div>
  </header>
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    <p>Outil de formation. Dossiers fictifs. Ne remplace ni le protocole local ni l'avis du référent en antibiothérapie. Contenu à relire par l'EOH avant usage institutionnel.</p>
  </footer>
  <script src="cases.js"></script>
  <script src="game.js"></script>
</body>
</html>
